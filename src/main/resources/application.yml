spring:
  application.name: ticketing
  config.import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ticketing}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate:
      jdbc.batch_size: 100
      order_inserts: true
  mvc.problemdetails.enabled: true
ticketing:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: PT1H
  countries:
    PH:
      enabled: true
      currency: PHP
      payment-provider: paymongo
      min-charge-minor: 2000
  booking:
    hold-duration: PT10M
    default-max-tickets-per-customer: 8
    platform-max-tickets-per-customer: 50
    expiry-interval: PT30S
